<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Gerador de tabuada</h1>

    <label for="numero-input">Digite um número: </label>
    <input type="number" id="numero-input" placeholder="Ex: 5">
    <button id="btn-gerar">Gerar tabuada</button>
    
    <div id="resultado">
        <!-- A tabuada será gerada aqui -->
        <!-- Só mostrará conteúdo quando o script.js gerar a tabuada -->
    </div>

    <script src="script.js"></script>
</body>
</html>
